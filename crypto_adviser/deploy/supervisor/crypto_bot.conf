; crypto_bot — тот же program name, что в /etc/supervisor/conf.d/bots.conf,
; но путь = workspace crypto_adviser (dev=prod).
;
; После migrate_supervisor_to_workspace.sh блок в bots.conf должен совпадать с этим.
;
; Управление:
;   sudo supervisorctl restart crypto_bot
;   sudo supervisorctl status crypto_bot
; или: ./scripts/deploy_prod.sh

[program:crypto_bot]
command=/home/appuser/dev/crypto/crypto_adviser/venv/bin/python3 /home/appuser/dev/crypto/crypto_adviser/main.py
directory=/home/appuser/dev/crypto/crypto_adviser
user=appuser
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/crypto_bot.err.log
stdout_logfile=/var/log/supervisor/crypto_bot.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED=1,PYTHONPATH="/home/appuser/dev/crypto/crypto_adviser",PATH="/home/appuser/dev/crypto/crypto_adviser/venv/bin:%(ENV_PATH)s"
