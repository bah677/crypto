; crypto_adviser — Telegram crypto bot (pump / funding+OI / entry-watch).
;
; Установка (один раз, от root):
;   sudo cp /home/appuser/dev/crypto/crypto_adviser/deploy/supervisor/crypto_adviser.conf \
;          /etc/supervisor/conf.d/crypto_adviser.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Управление:
;   sudo supervisorctl start crypto_adviser
;   sudo supervisorctl stop crypto_adviser
;   sudo supervisorctl restart crypto_adviser
;   sudo supervisorctl status crypto_adviser
;
; Перед первым запуском:
;   cd /home/appuser/dev/crypto/crypto_adviser
;   python3 -m venv venv
;   ./venv/bin/pip install -r requirements.txt
;   ./venv/bin/python scripts/init_db.py   # после настройки .env и PostgreSQL

[program:crypto_adviser]
command=/home/appuser/dev/crypto/crypto_adviser/venv/bin/python3 /home/appuser/dev/crypto/crypto_adviser/main.py
directory=/home/appuser/dev/crypto/crypto_adviser
user=appuser
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/crypto_adviser.err.log
stdout_logfile=/var/log/supervisor/crypto_adviser.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED=1,PYTHONPATH="/home/appuser/dev/crypto/crypto_adviser",PATH="/home/appuser/dev/crypto/crypto_adviser/venv/bin:%(ENV_PATH)s"

[group:crypto_adviser]
programs=crypto_adviser
priority=999
