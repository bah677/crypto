; gold_adviser — XAU/USD M1 anomaly scanner
;
; Установка (один раз, от root):
;   sudo cp /home/appuser/dev/crypto/gold_adviser/deploy/supervisor/gold_adviser.conf \
;          /etc/supervisor/conf.d/gold_adviser.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Управление:
;   sudo supervisorctl start gold_adviser
;   sudo supervisorctl stop gold_adviser
;   sudo supervisorctl restart gold_adviser
;   sudo supervisorctl status gold_adviser
;
; Перед первым запуском:
;   cd /home/appuser/dev/crypto/gold_adviser
;   python3 -m venv venv
;   ./venv/bin/pip install -r requirements.txt
;   # создать БД: scripts/create_db.sql
;   # заполнить .env (тот же TELEGRAM_BOT_TOKEN, что у crypto_adviser)

[program:gold_adviser]
command=/home/appuser/dev/crypto/gold_adviser/venv/bin/python3 /home/appuser/dev/crypto/gold_adviser/main.py
directory=/home/appuser/dev/crypto/gold_adviser
user=appuser
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/gold_adviser.err.log
stdout_logfile=/var/log/supervisor/gold_adviser.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED=1,PYTHONPATH="/home/appuser/dev/crypto/gold_adviser",PATH="/home/appuser/dev/crypto/gold_adviser/venv/bin:%(ENV_PATH)s"

[group:gold_adviser]
programs=gold_adviser
priority=998
