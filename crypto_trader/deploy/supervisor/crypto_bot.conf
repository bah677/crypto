; crypto_bot — личный EMA/pump (crypto_trader), НЕ crypto_adviser (подписчики).
;
; В /etc/supervisor/conf.d/bots.conf program называется crypto_bot.

[program:crypto_bot]
command=/home/appuser/dev/crypto/crypto_trader/venv/bin/python3 /home/appuser/dev/crypto/crypto_trader/main.py
directory=/home/appuser/dev/crypto/crypto_trader
user=appuser
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/crypto_bot.err.log
stdout_logfile=/var/log/supervisor/crypto_bot.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED=1,PYTHONPATH="/home/appuser/dev/crypto/crypto_trader",PATH="/home/appuser/dev/crypto/crypto_trader/venv/bin:%(ENV_PATH)s"
